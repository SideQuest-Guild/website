name: sidequest

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sidequest
      POSTGRES_PASSWORD: sidequest
      POSTGRES_DB: sidequest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidequest -d sidequest"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
