[project]
name = "sidequest-bot"
version = "0.1.0"
description = "discord.py bot for the SideQuest Guild"
authors = [{ name = "Jacob Coffee", email = "jacob@z7x.org" }]
requires-python = ">=3.15,<4.0"
license = { text = "MIT" }
dependencies = [
    "sidequest-common",
    "discord-py>=2.7",
    "httpx>=0.28",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "tenacity>=9.2",
]

[project.scripts]
sidequest-bot = "sidequest_bot.__main__:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
sidequest-common = { workspace = true }
