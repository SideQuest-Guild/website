[project]
name = "sidequest-common"
version = "0.1.0"
description = "Shared models, schemas, settings, and leveling math for SideQuest services"
authors = [{ name = "Jacob Coffee", email = "jacob@z7x.org" }]
requires-python = ">=3.15,<4.0"
license = { text = "MIT" }
dependencies = [
    "advanced-alchemy>=1.12",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.0.40,<2.1",  # advanced-alchemy 1.12 uses sqlalchemy.util.portable_instancemethod (removed in 2.1)
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
