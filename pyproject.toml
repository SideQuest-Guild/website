# SideQuest Guild workspace: one Litestar backend (api/) for the website (website/) and addons.
# The Discord bot lives in SideQuest-Guild/bot and talks to the API over HTTP (X-API-Key).

[tool.uv.workspace]
members = [
    "packages/sidequest-common",
    "api",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "coverage>=7.10",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    "pytest-socket>=0.7",
    "respx>=0.23",
    "codespell>=2.4",
    "prek>=0.5",
    "ruff>=0.17",
    "pyrefly>=1.4.0",
]

[tool.codespell]
quiet-level = 3
skip = "uv.lock,./website,./.venv"
ignore-words-list = "selectin"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".*", "*.egg-info", ".git", ".venv", "node_modules", "website", "htmlcov"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--import-mode=importlib",
    "-p", "no:doctest",
    "--disable-socket",
    "--allow-unix-socket",
]
markers = [
    "integration: needs external services",
]
# aiosqlite under pytest: SQLAlchemy reports GC'd pool connections between tests even though each app's pool
# is empty after shutdown (verified outside pytest). Test-only; production runs on Postgres.
filterwarnings = [
    "ignore:The garbage collector is trying to clean up non-checked-in connection:sqlalchemy.exc.SAWarning",
]
log_level = "WARNING"

[tool.coverage.run]
source = ["sidequest_common", "sidequest_api"]
omit = ["*/migrations/*"]
branch = true

[tool.pyrefly]
project-includes = ["packages/sidequest-common/src", "api/src", "tests"]
project-excludes = ["website/**", "api/src/sidequest_api/lib/migrations/**"]
search-path = ["packages/sidequest-common/src", "api/src"]
python-version = "3.15.0"
python-interpreter-path = ".venv/bin/python3"
baseline = "pyrefly-baseline.json"

[tool.ruff]
line-length = 120
target-version = "py315"
src = ["packages/sidequest-common/src", "api/src", "tests"]
extend-exclude = ["website"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "COM812",
    "CPY001",
    "D105",
    "D107",
    "D203",
    "D213",
    "ERA001",
    "FIX002",
    "ISC001",
    "PLR0913",
    "RUF012",
    "TD",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["sidequest_common", "sidequest_api", "tests"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "advanced_alchemy.base.UUIDAuditBase",
    "advanced_alchemy.base.BigIntAuditBase",
]

[tool.ruff.lint.per-file-ignores]
"**/__main__.py" = ["PLC0415"]  # lazy imports keep `--help`/startup errors cheap
"api/src/sidequest_api/app.py" = ["PLC0415"]
"api/src/sidequest_api/lib/website.py" = ["PLC0415"]  # litestar_vite only imported when dev mode actually uses it
"api/src/sidequest_api/domain/**/controllers.py" = ["TC001", "TC002", "TC003", "D102"]  # Litestar resolves handler annotations at runtime; operation docs live in summary=/description= kwargs, not docstrings
"api/src/sidequest_api/lib/migrations/**" = ["ALL"]  # alembic-generated
"tests/**" = [
    "ANN", "ARG", "D", "DTZ", "EM", "FBT", "INP", "PLC", "PLR", "PLR2004", "PT011", "S", "SLF", "TC", "TRY",
]
