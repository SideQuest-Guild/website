name: Deployed

# Cabotage reports every production deploy to GitHub as a deployment. Once the web deploy succeeds, empty
# Cloudflare's cache (pages are kept at the edge for up to a day and would point at the old build's files), then
# run the end-to-end tests against the live site. The API stays mocked, so this checks the deployed pages and code.

on:
  deployment_status:

concurrency:
  group: deployed
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  purge:
    name: Purge Cloudflare cache
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'coffee/sidequest/production/web'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Token: zone sidequest-guild.com, Cache Purge only (Cloudflare token "sidequest-ci-cache-purge").
      - name: Purge everything
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

  e2e:
    name: End-to-end against sidequest-guild.com (${{ matrix.project }})
    needs: purge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, iphone, android, small-phone]
    defaults:
      run:
        working-directory: website
    env:
      E2E_BASE_URL: https://sidequest-guild.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Install Node (website/mise.toml)
        uses: jdx/mise-action@v5
        with:
          working_directory: website
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps ${{ (matrix.project == 'iphone' || matrix.project == 'small-phone') && 'webkit' || 'chromium' }}

      - name: Playwright
        run: npm run e2e -- --project=${{ matrix.project }} --workers=100%

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live-${{ matrix.project }}
          path: |
            website/playwright-report
            website/test-results
          retention-days: 14
