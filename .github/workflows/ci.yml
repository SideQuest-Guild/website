name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: 1
  FORCE_COLOR: 1

jobs:
  python-quality:
    name: Python lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (Python from .python-version)
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --locked

      - name: Ruff format
        run: uv run --no-sync ruff format --check --diff .

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Pyrefly (fails on errors not in pyrefly-baseline.json)
        run: uv run --no-sync pyrefly check

      - name: Codespell
        run: uv run --no-sync codespell

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (Python from .python-version)
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --locked

      - name: Pytest
        run: uv run --no-sync pytest -q -W error::DeprecationWarning --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  website:
    name: Website lint, format, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - name: Install Node (website/mise.toml)
        uses: jdx/mise-action@v5
        with:
          working_directory: website
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: oxfmt
        run: npx oxfmt --check

      - name: oxlint
        run: npx oxlint --deny-warnings --format=github

      - name: Astro check
        run: npx astro check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  website-e2e:
    name: Website end-to-end (${{ matrix.project }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each device in two halves on its own runner, at Playwright's default worker count: more parallel workers on one
    # 4-vCPU runner starved WebKit and made the phone tests flaky.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, iphone, android, small-phone]
        shard: [1, 2]
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - name: Install Node (website/mise.toml)
        uses: jdx/mise-action@v5
        with:
          working_directory: website
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps ${{ (matrix.project == 'iphone' || matrix.project == 'small-phone') && 'webkit' || 'chromium' }}

      - name: Build
        run: npm run build

      - name: Playwright
        run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            website/playwright-report
            website/test-results
          retention-days: 14

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          tags: sidequest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
