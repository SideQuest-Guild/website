name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: 1
  FORCE_COLOR: 1

jobs:
  python-quality:
    name: Python lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (Python from .python-version)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --locked

      - name: Ruff format
        run: uv run --no-sync ruff format --check --diff .

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Pyrefly (fails on errors not in pyrefly-baseline.json)
        run: uv run --no-sync pyrefly check

      - name: Codespell
        run: uv run --no-sync codespell

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (Python from .python-version)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --locked

      - name: Pytest
        run: uv run --no-sync pytest -q -W error::DeprecationWarning --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  website:
    name: Website lint, format, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node (website/mise.toml)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          working_directory: website
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: oxfmt
        run: npx oxfmt --check

      - name: oxlint
        run: npx oxlint --deny-warnings --format=github

      - name: Astro check
        run: npx astro check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: website/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read the locked Playwright version
        id: read
        run: >-
          echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' website/package-lock.json)"
          >> "$GITHUB_OUTPUT"

  website-e2e:
    name: Website end-to-end (${{ matrix.project }} ${{ matrix.shard }}/2)
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own image for the locked version already holds every browser and the system libraries they need.
    # Installing WebKit's libraries with `playwright install --with-deps` pulls them from Azure's Ubuntu mirror, which
    # has crawled at a few KB/s and run the job past its time limit.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    # Each device in two halves on its own runner, at Playwright's default worker count: more parallel workers on one
    # 4-vCPU runner starved WebKit and made the phone tests flaky.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, iphone, android, small-phone]
        shard: [1, 2]
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node (website/mise.toml)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          working_directory: website
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Playwright
        run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            website/playwright-report
            website/test-results
          retention-days: 14

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: sidequest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
