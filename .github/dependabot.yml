version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    groups:
      website: { patterns: ["*"], update-types: [minor, patch] }
